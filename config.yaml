# ---- Tavily 网页新闻搜索（补固定 RSS 之外的大新闻；需要 TAVILY_API_KEY） ----
tavily:
  enabled: true
  days: 2                # 只取近 N 天的新闻，避免捞回旧文
  max_results: 4         # 每条查询取几条
  queries:
    - query: "site:openai.com/news OR site:anthropic.com/news OR site:deepmind.google/blog latest AI model product release"
      section: "AI"
      source: "AI 官方补源 (Tavily)"
    - query: "Reuters OR AP OR Bloomberg major AI regulation model launch semiconductor AI infrastructure"
      section: "AI"
      source: "AI 高可信媒体补源 (Tavily)"
    - query: "site:gov.cn OR site:pbc.gov.cn OR site:stats.gov.cn 中国 重要 政策 宏观 经济"
      section: "宏观/政策"
      source: "中国政策补源 (Tavily)"
    - query: "Reuters Bloomberg Financial Times central bank inflation trade fiscal policy latest"
      section: "宏观/政策"
      source: "宏观高可信媒体补源 (Tavily)"
    - query: "Reuters Bloomberg Financial Times major company earnings acquisition layoffs semiconductor cloud AI latest"
      section: "商业/科技"
      source: "商业科技补源 (Tavily)"
    - query: "site:latepost.com OR site:caixin.com OR site:jiemian.com 科技 公司 产业 资本"
      section: "商业/科技"
      source: "中文商业科技补源 (Tavily)"
    - query: "Reuters AP BBC long term impact world policy society conflict climate health latest"
      section: "国际/社会"
      source: "国际社会补源 (Tavily)"
    - query: "consumer technology health education travel housing cost of living major change"
      section: "消费/生活"
      source: "消费生活补源 (Tavily)"
  # 想盯的 X / 行业人物——Tavily 搜他们近期的相关报道与言论（不是原始推文）
  people:
    - "Sam Altman"
    - "Demis Hassabis"
    - "Dario Amodei"
    - "Andrew Ng"
  people_max_results: 2   # 每个人物取几条

# ---- 预过滤（在调用 AI 之前，省额度。留空=不过滤） ----
filters:
  # 标题含这些词就丢弃（公关稿/聚合简报噪音）
  blocked_keywords: ["trading bot", "price prediction", "sponsored post", "press release distribution"]
  required_keywords: []       # 非空时，标题必须含其中之一

# ---- AI 富化（Gemini Flash，免费） ----
ai:
  enabled: true
  model: "gemini-2.0-flash"
  rate_limit_seconds: 7       # 每次调用间隔
  batch_size: 5               # 每次调用处理几条
  min_score: 45               # 先放宽候选，最终由板块限量控制，避免每日条目太少
  # 你关心的方向，AI 据此打分
  priorities:
    - "AI：每天保留，优先选模型、产品、算力、监管或真实使用变化"
    - "宏观/政策：只选会影响市场预期、行业规则或普通人生活成本的变化"
    - "商业/科技：优先选大公司战略、产业链、并购、财报、基础设施变化"
    - "国际/社会：只选有长期外溢影响的事件"
    - "消费/生活：偶尔补充，必须和普通人的工具、健康、教育、住房、出行或消费有关"

# ---- 信源权重与自动质检 ----
