# ============================================================
# 今日重要信号 — 配置文件。改这里即可，无需动代码。
# ============================================================

# 只保留发布时间在这个窗口内的条目（小时）。
# 扩到 48 小时：宁可多给 AI 一点候选，也避免高质量源周末/时差导致条目太少。
lookback_hours: 48

# ---- YouTube 频道（用频道 ID，免费 RSS） ----
# 先停用视频源：视频更新时间不稳定，且容易把简报拉回 AI-only 长内容。
youtube: []

# ---- 新闻 / Newsletter / 博客（RSS / Atom） ----
# 可选的源级过滤（不必把相关性全压给 AI）：
#   require_keywords: ["ai", "llm"]   # 标题须含其一，否则丢弃（适合“全量型”信源）
#   block_keywords:   ["招聘"]         # 标题含其一就丢弃
