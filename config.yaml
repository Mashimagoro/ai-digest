# ---- 简报与邮件 ----
digest:
  subject_prefix: "今日重要信号"
  top_n: 8                    # 兼容旧参数；新版按 sections 控制
  write_overview: true        # 是否让 AI 写一段当日总览
  sections:
    - label: "AI"
      note: "每天保留"
      max_items: 2
    - label: "宏观/政策"
      note: "有重要变化才上"
      max_items: 2
    - label: "商业/科技"
      note: "优先选产业变化"
      max_items: 2
    - label: "国际/社会"
      note: "只选有长期影响的"
      max_items: 1
    - label: "消费/生活"
      note: "偶尔补充，更接地气"
      max_items: 1

mail:
